
name: Python Dependency Checker

on:
  push:
    paths:
      - 'backend/requirements.txt'
      - '.github/workflows/dependency-checker.yml'

  pull_request:
    paths:
      - 'backend/requirements.txt'
      - '.github/workflows/dependency-checker.yml'

  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Check Python Dependencies
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # 3. Installer les dependances du backend
      - name: Install Python dependencies
        id: install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Detecter les versions plus recentes
      - name: Check outdated dependencies
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pip list --outdated --format=columns

      # 5. Installer pip-audit
      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      # 6. Verifier les vulnerabilites connues
      - name: Security audit
        run: |
          pip-audit -r backend/requirements.txt
