
name: CI

on:
  # Exécuter la CI à chaque push sur toutes les branches sauf main
  push:
    branches-ignore:
      - main
  # Exécuter la CI sur les PR ciblant main
  pull_request:
    branches:
      - main

  # Permettre le lancement manuel
  workflow_dispatch:

# Permissions minimales
permissions:
  contents: read

jobs:
  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: pytest -v

  # ==========================================
  # FRONTEND PUBLIC
  # ==========================================
  frontend-public:
    name: Frontend Public - Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

  # ==========================================
  # FRONTEND ADMIN
  # ==========================================
  frontend-admin:
    name: Frontend Admin - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # - name: Run tests
      #   run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

  # ==========================================
  # GITLEAKS - SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # DOCKER - BUILD IMAGES
  # ==========================================
  docker:
    name: Docker - Build ${{ matrix.component }}
    runs-on: ubuntu-latest

    # Ne construire les images que si les vérifications passent
    needs:
      - backend
      - frontend-public
      - frontend-admin
      - gitleaks

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend-public
          - frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          tags: marvel-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
  # ==========================================
  # DOCKER - INTEGRATION TESTS
  # ==========================================
  docker-integration:
    name: Docker - Integration Tests
    runs-on: ubuntu-latest
    needs:
      - docker

    env:
      DATABASE_URL: postgresql+psycopg://marvel:marvel_ci_password@db:5432/marvel_ci?sslmode=disable
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
      AUTH_COOKIE_SECURE: "false"
      VITE_API_URL: ""
      VITE_ADMIN_URL: http://localhost:8081
      VITE_PUBLIC_URL: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            up --build -d --wait --wait-timeout 180

      - name: Test backend liveness
        run: |
          curl --fail --show-error http://localhost:8000/health

      - name: Test backend readiness and database connection
        run: |
          curl --fail --show-error http://localhost:8000/ready
          curl --fail --silent http://localhost:8000/ready | grep -q '"database":"connected"'

      - name: Test public frontend
        run: |
          curl --fail --show-error http://localhost:8080/

      - name: Test admin frontend
        run: |
          curl --fail --show-error http://localhost:8081/

      - name: Display container status
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            ps

      - name: Display logs on failure
        if: failure()
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            logs --no-color

      - name: Stop containers and remove test volumes
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            down --volumes --remove-orphans
