
name: CI

on:
  # Exécuter la CI à chaque push sur toutes les branches sauf main
  push:
    branches-ignore:
      - main

  # Exécuter la CI sur les PR ciblant main
  pull_request:
    branches:
      - main

  # Permettre le lancement manuel
  workflow_dispatch:

# Permissions minimales
permissions:
  contents: read

jobs:
  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: pytest -v

  # ==========================================
  # FRONTEND PUBLIC
  # ==========================================
  frontend-public:
    name: Frontend Public - Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

  # ==========================================
  # FRONTEND ADMIN
  # ==========================================
  frontend-admin:
    name: Frontend Admin - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # - name: Run tests
      #   run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

  # ==========================================
  # GITLEAKS - SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # DOCKER - BUILD IMAGES
  # ==========================================
  docker:
    name: Docker - Build ${{ matrix.component }}
    runs-on: ubuntu-latest

    # Ne construire les images que si les vérifications passent
    needs:
      - backend
      - frontend-public
      - frontend-admin
      - gitleaks

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend-public
          - frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          tags: marvel-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}